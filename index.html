<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <h1 class="app-title">⏰Study Tracker</h1>
    <button type="button" id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
  </header>

  <main class="app">
    <section class="card">
      <h2>Focus Clock</h2>
      <div class="timer-display" id="timer">25:00</div>
      <div class="timer-config">
        <label for="customMinutes">Duration (mins):</label>
        <input type="number" id="customMinutes" min="1" max="180" value="25" />
      </div>
      <div class="preset-row">
        <button type="button" class="preset-btn" data-mins="15">15 min</button>
        <button type="button" class="preset-btn active" data-mins="25">25 min</button>
        <button type="button" class="preset-btn" data-mins="45">45 min</button>
        <button type="button" class="preset-btn" data-mins="60">60 min</button>
      </div>
      <div class="btn-row">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" class="secondary">Pause</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
      <div class="stats-bar">
        Completed Sessions: <strong id="sessionCount">0</strong> (<span id="totalMinutes">0</span> mins logged)
      </div>
    </section>

    <section class="card">
      <h2>Study Task List</h2>
      <form id="taskForm">
        <input type="text" id="taskInput" placeholder="e.g., Practice Java OOP exercises..." required />
        <select id="subjectSelect">
          <option value="Computer Science">Computer Science</option>
          <option value="Mathematics">Mathematics</option>
          <option value="IELTS Prep">IELTS Prep</option>
          <option value="General">General</option>
        </select>
        <button type="submit">Add Task</button>
      </form>
      <ul id="taskList"></ul>
    </section>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    let isDark = localStorage.getItem('study_dark_mode') === 'true';

    function applyTheme() {
      document.body.classList.toggle('dark', isDark);
      themeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    themeToggle.onclick = () => {
      isDark = !isDark;
      localStorage.setItem('study_dark_mode', isDark);
      applyTheme();
    };
    applyTheme();

    let durationMins = Number(localStorage.getItem('study_duration') || 25);
    let timeLeft = durationMins * 60;
    let timerId = null;
    let sessions = Number(localStorage.getItem('study_sessions') || 0);
    let loggedMinutes = Number(localStorage.getItem('study_minutes') || sessions * 25);

    const timerEl = document.getElementById('timer');
    const customMinutesInput = document.getElementById('customMinutes');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const sessionEl = document.getElementById('sessionCount');
    const minutesEl = document.getElementById('totalMinutes');

    customMinutesInput.value = durationMins;

    function updatePresetHighlight() {
      presetBtns.forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.mins) === durationMins);
      });
    }

    function setDuration(mins) {
      const validMins = Math.min(180, Math.max(1, Math.floor(Number(mins) || 25)));
      durationMins = validMins;
      customMinutesInput.value = validMins;
      localStorage.setItem('study_duration', validMins);
      updatePresetHighlight();

      if (!timerId) {
        timeLeft = durationMins * 60;
        updateTimerDisplay();
      }
    }

    presetBtns.forEach(btn => {
      btn.onclick = () => {
        clearInterval(timerId);
        timerId = null;
        setDuration(btn.dataset.mins);
      };
    });

    customMinutesInput.onchange = () => {
      clearInterval(timerId);
      timerId = null;
      setDuration(customMinutesInput.value);
    };

    function updateStats() {
      sessionEl.textContent = sessions;
      minutesEl.textContent = loggedMinutes;
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secs = String(timeLeft % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }

    document.getElementById('startBtn').onclick = () => {
      if (timerId) return;
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          sessions++;
          loggedMinutes += durationMins;
          localStorage.setItem('study_sessions', sessions);
          localStorage.setItem('study_minutes', loggedMinutes);
          updateStats();
          timeLeft = durationMins * 60;
          updateTimerDisplay();
          alert(`Focus session complete! ${durationMins} minutes logged.`);
        }
      }, 1000);
    };

    document.getElementById('pauseBtn').onclick = () => {
      clearInterval(timerId);
      timerId = null;
    };

    document.getElementById('resetBtn').onclick = () => {
      clearInterval(timerId);
      timerId = null;
      timeLeft = durationMins * 60;
      updateTimerDisplay();
    };

    let tasks = JSON.parse(localStorage.getItem('study_tasks') || '[]');
    const taskList = document.getElementById('taskList');

    function saveAndRenderTasks() {
      localStorage.setItem('study_tasks', JSON.stringify(tasks));
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const left = document.createElement('label');
        left.className = 'task-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';
        checkbox.checked = Boolean(task.done);
        checkbox.onchange = () => {
          tasks[index].done = checkbox.checked;
          saveAndRenderTasks();
        };

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = task.subject;

        const textSpan = document.createElement('span');
        textSpan.className = 'task-text';
        textSpan.textContent = task.text;

        left.append(checkbox, tag, textSpan);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = 'Delete';
        delBtn.className = 'danger';
        delBtn.onclick = () => {
          tasks.splice(index, 1);
          saveAndRenderTasks();
        };

        li.append(left, delBtn);
        taskList.appendChild(li);
      });
    }

    document.getElementById('taskForm').onsubmit = (e) => {
      e.preventDefault();
      const text = document.getElementById('taskInput').value.trim();
      const subject = document.getElementById('subjectSelect').value;
      if (!text) return;
      tasks.push({ text, subject, done: false });
      document.getElementById('taskInput').value = '';
      saveAndRenderTasks();
    };

    updatePresetHighlight();
    updateStats();
    updateTimerDisplay();
    saveAndRenderTasks();
  </script>
</body>
</html>
